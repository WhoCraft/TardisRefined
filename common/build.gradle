architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom {
    accessWidenerPath = file("src/main/resources/tardis_refined.accesswidener")
}

dependencies {
    // We depend on fabric loader here to use the fabric @Environment annotations and get the mixin dependencies
    // Do NOT use other classes from fabric loader
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    // Forge Config API Port
    modCompileOnlyApi("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${rootProject.forge_config_api_port_version}") {
        because "Ensure the dependency is resolved from the specified repository."
    }

    // Sodium
    modImplementation "maven.modrinth:sodium:${rootProject.sodium_version}"

    modCompileOnlyApi ("com.github.iPortalTeam:ImmersivePortalsMod:${rootProject.immersive_portals_version}")

    modCompileOnly("com.simibubi.create:create-${minecraft_version}:${create_version_forge}:slim"){transitive = false}

    api("dev.ryanhcode.sable-companion:sable-companion-common-${project.minecraft_version}:${project.sable_companion_version}")
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}