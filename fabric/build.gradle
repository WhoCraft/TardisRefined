plugins {
    id 'net.fabricmc.fabric-loom'
}

group = 'whocraft'
version = "mc${minecraft_version}-v${mod_version}"
base {
    archivesName = 'tardis_refined'
}

repositories {
    maven { url = 'https://cursemaven.com' }
    maven { url = 'https://maven.ladysnake.org/releases' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
    maven { url = 'https://maven.fabricmc.net/' }
}

loom {
    accessWidenerPath = file('../common/src/main/resources/tardis_refined.accesswidener')
}

sourceSets.main.java.srcDirs += '../common/src/main/java'
sourceSets.main.resources.srcDirs += '../common/src/main/resources'
sourceSets.main.java {
    exclude 'whocraft/tardis_refined/compat/portals/**'
    exclude 'whocraft/tardis_refined/compat/create/**'
    exclude 'whocraft/tardis_refined/compat/valkyrienskies/VSHelper.java'
    exclude 'whocraft/tardis_refined/mixin/render/SodiumFixMixin.java'
    exclude 'whocraft/tardis_refined/client/TRItemColouring.java'
    exclude 'whocraft/tardis_refined/compat/trinkets/TrinketsUtil.java'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation 'curse.maven:geckolib-388172:8945630'

    implementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${cardinal_version}"
    implementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:${cardinal_version}"
    implementation "org.ladysnake.cardinal-components-api:cardinal-components-level:${cardinal_version}"
    include "org.ladysnake.cardinal-components-api:cardinal-components-base:${cardinal_version}"
    include "org.ladysnake.cardinal-components-api:cardinal-components-entity:${cardinal_version}"
    include "org.ladysnake.cardinal-components-api:cardinal-components-level:${cardinal_version}"

    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api_port_version}"
    include "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api_port_version}"

    implementation 'com.google.code.findbugs:jsr305:3.0.2'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '3000']
}

processResources {
    inputs.properties([
        version: mod_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_description: mod_description,
        mod_authors: mod_authors,
        mod_license: mod_license
    ])
    filesMatching('fabric.mod.json') {
        expand(
            version: mod_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_description: mod_description,
            mod_authors: mod_authors,
            mod_license: mod_license,
            minecraft_version: minecraft_version,
            loader_version: loader_version,
            fabric_api_version: fabric_api_version
        )
    }
}

jar {
    from(rootProject.file('LICENSE.MD')) {
        rename { "LICENSE_TARDIS_REFINED.md" }
    }
}
