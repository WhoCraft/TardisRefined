# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [push]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        # Use these Java versions
        java: [
          21,    # Current Java LTS & minimum supported by Minecraft
        ]
        # and run on Linux
        os: [ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v3
      - name: validate gradle wrapper
        uses: gradle/wrapper-validation-action@v1
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew
      - name: download-assets
        run: ./gradlew downloadAssets
      - name: datagen
        run: ./gradlew runData
      - name: build
        run: ./gradlew build
      - name: make-upload-dir
        run: mkdir upload
      - name: copy-binaries
        run: find . -regextype posix-extended -iregex "\./(fabric|forge)/build/libs/(fabric|forge)-tardis_refined-mc[0-9]+(\.[0-9]+)+-v[0-9]+(\.[0-9]+)*\.jar" -exec cp {} ./upload \;
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: upload/
      - name: remove-previous # To clean up the release so we only have the latest jar files
        if: github.ref == 'refs/heads/dev/1.20.1'
        uses: liudonghua123/delete-release-action@v1
        with:
          release_name: 'TARDIS Refined 1.20.1 Nightly Build'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: publish
        if: github.ref == 'refs/heads/dev/1.20.1'
        uses: softprops/action-gh-release@v3
        with:
          name: TARDIS Refined 1.20.1 Nightly Build
          tag_name: nightly-1.20.1
          body: This is development build of TARDIS Refined, expect bugs.
          prerelease: true
          files: |
            upload/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}