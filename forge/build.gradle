plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle'
    id 'org.spongepowered.mixin'
}

mixin {
    config("${mod_id}.common.mixins.json")
}

jar {
    manifest {
        attributes["MixinConfigs"] = "${mod_id}.common.mixins.json"
    }
}

//Use the existing Neoforge data generator for resource pack data
def generatedResources = project(":neoforge").file("src/generated/resources")

sourceSets {
    main {
        resources.srcDir generatedResources
    }
}

repositories {
    maven { url = uri("https://maven.minecraftforge.net/") }
    maven { url = uri("https://repo1.maven.org/maven2/") }
}


minecraft {

    mappings channel: 'official', version: minecraft_version

    copyIdeResources = true //Calls processResources when in dev

    reobf = false // Forge 1.20.6+ uses official mappings at runtime, so we shouldn't reobf from official to SRG

    // Automatically enable forge AccessTransformers if the file exists
    // This location is hardcoded in Forge and can not be changed.
    // https://github.com/MinecraftForge/MinecraftForge/blob/be1698bb1554f9c8fa2f58e32b9ab70bc4385e60/fmlloader/src/main/java/net/minecraftforge/fml/loading/moddiscovery/ModFile.java#L123
    // Forge still uses SRG names during compile time, so we cannot use the common AT's
    def at = file("src/main/resources/META-INF/accesstransformer.cfg")
    if (at.exists()) {
        accessTransformer = at
    }


    runs {
        // applies to all the run configs below
        configureEach {
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'eventbus.api.strictRuntimeChecks', 'true'
        }

        client {
            workingDirectory file('runs/client')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Client'
            mods {
                modClientRun {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory file('runs/server')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Server'
            mods {
                modServerRun {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory file('runs/data')
            ideaModule "${rootProject.name}.${project.name}.main"
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            taskName 'Data'
            mods {
                modDataRun {
                    source sourceSets.main
                }
            }
        }
    }

}

dependencies {
    minecraft  "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0-beta.7'

    // Hack fix for now, force jopt-simple to be exactly 5.0.4 because Mojang ships that version, but some transitive dependencies request 6.0+
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }

//    implementation("me.shedaniel.cloth:cloth-config-forge:${rootProject.cloth_config_version}")

    //MixinExtras
    //Dev runtime
//    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-forge:0.4.1"))
//    //Prod runtime
//    implementation(jarJar("io.github.llamalad7:mixinextras-forge:${rootProject.mixin_extras_version}")) {
//        jarJar.ranged(it, "[${rootProject.mixin_extras_version},)")
//    }
//
//    //Use Neoforge Config specific for Forge as specified by https://github.com/Fuzss/forgeconfigapiport/wiki/Getting-Started-on-1.20.2-and-Up#selecting-a-version
//    api ("fuzs.forgeconfigapiport:forgeconfigapiport-forge:${rootProject.forge_config_api_port_version}")
//    implementation(jarJar("fuzs.forgeconfigapiport:forgeconfigapiport-forge:${rootProject.forge_config_api_port_version}")){
//        jarJar.ranged(it, "[${rootProject.forge_config_api_port_version},)")
//    }

}


publishing {
    publications {
        mavenJava(MavenPublication) {
            fg.component(it)
        }
    }
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}
